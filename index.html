<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>strange game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom, #20252D, #15181D);
      color: #E5E7EB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 1rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #D1D5DB;
    }
    
    a { 
      color: #4AEAC9;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border: 2px solid #4AEAC9;
      border-radius: 8px;
      transition: all 0.3s ease;
      display: inline-block;
    }
    
    a:hover {
      background-color: #4AEAC9;
      color: #15181D;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 234, 201, 0.3);
    }
    
    .container {
      max-width: 600px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>strange game</h1>
    <p>the coolest daily ai image generation competition</p>
    <p><a href="https://discord.gg/swcHk3pq8Z" target="_blank">
      join our community on discord!
    </a></p>
  </div>
</body>
</html>
